<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Streaming Room</title>
    <!-- مكتبة مشغل الفيديو Video.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #38bdf8;
            font-size: 24px;
        }
        
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .player-container {
            flex: 2;
            min-width: 300px;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        .channels-list {
            flex: 1;
            min-width: 250px;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            max-height: 500px;
            overflow-y: auto;
        }
        
        .channel-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: #334155;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: right;
            font-size: 16px;
            transition: 0.3s;
        }
        
        .channel-btn:hover,
        .channel-btn.active {
            background: #0284c7;
        }
        
        .video-js {
            width: 100%;
            height: 450px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <header>
        <h1>غرفة البث الخاصة - أصحاب الصاكة 🎮</h1>
        <p>جودة عالية بدون إعلانات مزعجة</p>
    </header>

    <div class="container">
        <!-- مشغل الفيديو -->
        <div class="player-container">
            <video id="my-video" class="video-js vjs-big-play-centered" controls preload="auto" data-setup="{}">
                <source id="stream-source" src="" type="application/x-mpegURL">
                متصفحك لا يدعم مشغل الفيديو.
            </video>
        </div>

        <!-- قائمة القنوات -->
        <div class="channels-list">
            <h3>قائمة القنوات</h3>
            <button class="channel-btn active" onclick="changeChannel('رابط_بي_إن_1_هنا', this)">BeIN Sports 1 HD</button>
            <button class="channel-btn" onclick="changeChannel('رابط_بي_إن_2_هنا', this)">BeIN Sports 2 HD</button>
            <button class="channel-btn" onclick="changeChannel('رابط_بي_إن_3_هنا', this)">BeIN Sports 3 HD</button>
            <button class="channel-btn" onclick="changeChannel('رابط_بي_إن_4_هنا', this)">BeIN Sports 4 HD</button>
            <button class="channel-btn" onclick="changeChannel('رابط_بي_إن_5_هنا', this)">BeIN Sports 5 HD</button>
            <button class="channel-btn" onclick="changeChannel('رابط_ألوان_هنا', this)">Alwan Sport</button>
            <button class="channel-btn" onclick="changeChannel('رابط_4k_هنا', this)">BeIN Sports 4K</button>
        </div>
    </div>

    <!-- سكريبت تشغيل الروابط -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        var player = videojs('my-video');

        function changeChannel(url, btn) {
            // تغيير الكلاس النشط للأزرار
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // تغيير السورس وتشغيل البث
            player.src({
                type: 'application/x-mpegURL',
                src: url
            });
            player.play();
        }
    </script>
</body>

</html>
